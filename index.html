<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' blob:; worker-src blob:; style-src 'unsafe-inline'; connect-src 'self'; img-src data:; base-uri 'none'; form-action 'none'">
<meta name="description" content="リカーリングトピックの一覧とシード別の結果を閲覧できます。">
<title>リカーリングトピック集計</title>
<style>
:root {
  color-scheme: light;
  --paper: #fff;
  --ink: #161616;
  --muted: #4a4a4a;
  --line: #767676;
  --gutter: clamp(14px, 3vw, 40px);
  font: 14px/1.5 "Inter", "Noto Sans JP", system-ui, sans-serif;
  color: var(--ink);
  background: var(--paper);
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
::selection { background: var(--ink); color: var(--paper); }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
body { margin: 0; height: 100dvh; min-height: 480px; display: flex; flex-direction: column; }
header, .toolbar, .tabs, #message, #scopeBar, #schemaNotice, #conditionsBar, #datasetLine, footer {
  padding-inline: var(--gutter);
}
header {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 12px 24px;
  padding-block: 22px 16px;
  border-bottom: 1px solid var(--ink);
}
h1 { margin: 0; font-size: 1.75rem; line-height: 1.25; letter-spacing: -.02em; }
h2 { margin: 0; font-size: 1.25rem; line-height: 1.35; }
p { margin: 0; }
.source-file { margin-top: 5px; color: var(--muted); font-size: .86rem; overflow-wrap: anywhere; }
button, select, input, summary, textarea {
  font: inherit;
  color: inherit;
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 4px;
}
button, select, input, summary { min-height: 34px; padding: 5px 10px; }
button, summary { cursor: pointer; }
button:hover:not(:disabled), summary:hover { border-color: var(--ink); text-decoration: underline; }
button:disabled, input:disabled, select:disabled { color: var(--line); cursor: default; }
input, textarea { caret-color: var(--ink); }
input::placeholder { opacity: 1; color: var(--muted); }
input[type="checkbox"] { min-height: 0; margin: 0; accent-color: var(--ink); }
label { display: flex; align-items: center; gap: 8px; font-size: .86rem; }
label > input[type="number"], label > select { max-width: 100%; }
.primary { border-color: var(--ink); font-weight: 650; }
.toolbar { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 12px; padding-block: 12px; }
.search { flex: 1 1 240px; max-width: 420px; }
#search { width: 100%; }
#viewSwitcher { display: inline-flex; align-items: stretch; }
#viewSwitcher button { border: 0; border-radius: 0; border-bottom: 2px solid transparent; padding-inline: 11px; }
#viewSwitcher button[aria-pressed="true"] { border-bottom-color: var(--ink); font-weight: 700; }
.toolbar-actions { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; margin-left: auto; }
.tabs { display: flex; gap: 8px; overflow-x: auto; padding-block: 6px; border-bottom: 1px solid var(--line); }
.tab-item { display: flex; align-items: center; flex-shrink: 0; border-bottom: 2px solid transparent; }
.tab-item.active { border-bottom-color: var(--ink); }
.tab-item button { border: 0; }
.tab-item [role="tab"] { max-width: min(300px, 65vw); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tab-item.active [role="tab"] { font-weight: 650; }
.tab-close { min-width: 34px; }
#csvOptions, #columnsPanel { position: relative; }
#csvMenu, #columnMenu, #filterPopup {
  z-index: 8;
  width: min(330px, calc(100vw - 28px));
  border: 1px solid var(--ink);
  border-radius: 4px;
  padding: 12px;
  background: var(--paper);
}
#csvMenu, #columnMenu { position: absolute; top: calc(100% + 6px); right: 0; }
#csvMenu { display: grid; gap: 10px; }
#csvMenu > label { justify-content: space-between; }
#csvMenu > label:last-of-type { justify-content: flex-start; }
#rowLimitLabel { display: flex; align-items: center; gap: 6px; }
.row-stepper { display: grid; }
.row-stepper button { min-height: 20px; padding: 0 6px; font-size: .8rem; }
#rowLimit { appearance: textfield; }
#rowLimit::-webkit-inner-spin-button, #rowLimit::-webkit-outer-spin-button { -webkit-appearance: none; }
.column-actions, .filter-actions, .filter-pages { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.column-actions button, .filter-actions button, .filter-pages button { font-size: .86rem; }
.column-help, #filterNote { color: var(--muted); font-size: .86rem; margin-block: 8px; }
#columnList { max-height: min(310px, 35dvh); overflow: auto; }
.column-setting { display: flex; align-items: center; gap: 8px; padding: 4px 2px; }
.column-setting label { flex: 1; min-width: 0; }
.column-setting label span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.column-setting input[type="number"] { width: 74px; }
.unit { font-size: .86rem; }
#datasetLine, #scopeBar, #message, #schemaNotice { font-size: .86rem; padding-block: 7px; }
#datasetLine { display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 4px 12px; }
#datasetScope { font-weight: 700; }
#topicHint { color: var(--muted); }
#scopeBar { display: flex; flex-wrap: wrap; gap: 8px; }
#scopeBadge { font-weight: 650; }
#schemaNotice { display: flex; align-items: center; justify-content: space-between; gap: 8px; border-block: 1px solid var(--ink); }
#message.error { border-block: 1px solid var(--ink); font-weight: 650; }
body.topic-source #scopeBar, body.topic-source #count { display: none; }
body.topic-source #message:not(.error) {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  clip-path: inset(50%);
  overflow: hidden;
}
#conditionsBar { display: flex; flex-wrap: wrap; gap: 6px; padding-block: 5px; }
.condition-chip { display: flex; align-items: center; max-width: 100%; border: 1px solid var(--line); border-radius: 4px; }
.condition-chip span { padding: 3px 8px; max-width: min(360px, 70vw); max-height: 70px; overflow: auto; overflow-wrap: anywhere; font-size: .86rem; }
.condition-chip button { min-height: 32px; border: 0; }
main { min-height: 0; flex: 1; display: flex; flex-direction: column; padding: 0 var(--gutter); }
#empty { margin-block: auto; padding-block: 16px; max-width: 60ch; }
#empty p { margin-block: 6px 12px; color: var(--muted); }
#tableWrap { overflow: auto; flex: 1; border-top: 1px solid var(--ink); }
#table { table-layout: fixed; border-collapse: separate; border-spacing: 0; font-size: .93rem; font-variant-numeric: tabular-nums; }
.topic-summary #table { min-width: 100%; }
#table th, #table td { height: 38px; text-align: left; white-space: pre; overflow: hidden; text-overflow: ellipsis; }
#table th { position: sticky; top: 0; z-index: 2; padding: 0; border-bottom: 1px solid var(--ink); background: var(--paper); }
#table td { padding: 0 11px; border-bottom: 1px solid var(--line); }
#table th:first-child, #table td:first-child { position: sticky; left: 0; text-align: center; color: var(--muted); background: var(--paper); }
#table td:first-child { z-index: 1; }
#table th:first-child { z-index: 3; }
#table th button { border: 0; border-radius: 0; min-height: 34px; }
#table th .sort-button { width: calc(100% - 34px); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 4px 3px 4px 11px; text-align: left; }
#table th .filter-button { position: absolute; right: 8px; top: 0; bottom: 0; width: 26px; padding: 0; }
#table th .filter-button.filtered { outline: 1px solid var(--ink); outline-offset: -3px; font-weight: 700; }
.topic-summary #table th .filter-button { right: 2px; }
#table th button:focus-visible, #table td:focus-visible { outline-offset: -3px; }
#table tbody tr:hover td { border-bottom-color: var(--ink); }
#table td.number { text-align: right; }
.topic-button { min-height: 32px; padding: 3px 0; border: 0; border-radius: 0; font-weight: 650; text-decoration: underline; text-underline-offset: 3px; }
.topic-button:hover { text-decoration-thickness: 2px; }
.match-rate { font-weight: 650; }
.match-count { padding-left: 2px; font-size: .8rem; font-weight: 400; color: var(--muted); }
.no-value { color: var(--muted); }
.resize-handle { position: absolute; top: 0; right: 0; width: 8px; height: 100%; cursor: col-resize; touch-action: none; }
.resize-handle::after { content: ""; position: absolute; right: 2px; top: 9px; bottom: 9px; border-right: 1px solid var(--line); }
.resize-handle:focus-visible { outline-offset: -2px; }
body.resizing, body.resizing * { cursor: col-resize !important; user-select: none; }
#cellDetails { max-height: 35vh; overflow: auto; border-top: 1px solid var(--ink); padding-block: 10px; }
#cellDetailsHeader { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
#cellDetailsTitle { font-size: .93rem; overflow-wrap: anywhere; }
#cellText { width: 100%; height: 90px; min-height: 54px; resize: vertical; white-space: pre-wrap; padding: 8px; }
#cellCopyStatus { font-size: .86rem; }
footer { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 6px 12px; padding-block: 9px; border-top: 1px solid var(--ink); color: var(--muted); font-size: .86rem; }
#info { overflow-wrap: anywhere; }
.page-status, .pages { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
.pages button { min-height: 30px; }
#filterPopup { position: fixed; z-index: 9; max-height: calc(100dvh - 16px); overflow: auto; }
#filterTitle { margin: 0 0 8px; overflow-wrap: anywhere; }
#filterSearch { width: 100%; }
.filter-actions, .filter-pages { margin-block: 8px; }
#filterValues { max-height: 200px; overflow: auto; border-block: 1px solid var(--line); padding: 4px 2px; }
#filterValues label { padding-block: 4px; }
#filterValues label span { white-space: pre-wrap; overflow-wrap: anywhere; flex: 1; min-width: 0; }
#filterValues small { color: var(--muted); }
#dropOverlay { display: none; position: fixed; inset: 8px; z-index: 10; place-items: center; background: var(--paper); border: 2px dashed var(--ink); pointer-events: none; }
body.dragging #dropOverlay { display: grid; }
#topicDialog {
  width: min(830px, calc(100vw - 28px));
  max-height: calc(100dvh - 28px);
  margin: auto;
  padding: 0;
  color: var(--ink);
  background: var(--paper);
  border: 1px solid var(--ink);
  border-radius: 4px;
  overflow: auto;
}
#topicDialog::backdrop { background: var(--paper); }
.topic-dialog-header { position: sticky; top: 0; z-index: 3; display: flex; align-items: start; justify-content: space-between; gap: 12px; padding: 16px 20px; border-bottom: 1px solid var(--ink); background: var(--paper); }
#topicTitle { overflow-wrap: anywhere; }
#topicSubtitle { margin-top: 4px; color: var(--muted); font-size: .86rem; }
#topicContent { display: grid; gap: 18px; padding: 16px 20px 20px; }
.topic-metrics { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin: 0; }
.topic-metrics dt, .topic-detail-note { color: var(--muted); font-size: .86rem; }
.topic-metrics dd { margin: 3px 0 0; font-size: 1.25rem; font-weight: 650; font-variant-numeric: tabular-nums; }
.topic-section h3 { margin: 0 0 5px; font-size: 1rem; }
.topic-section p { overflow-wrap: anywhere; }
.topic-detail-note { margin-bottom: 5px; }
.word-support { display: flex; flex-wrap: wrap; gap: 5px 12px; list-style: none; margin: 0; padding: 0; }
.word-support small { margin-left: 4px; color: var(--muted); font-variant-numeric: tabular-nums; }
.seed-table-wrap { overflow: auto; }
.seed-table { width: 100%; min-width: 440px; border-collapse: collapse; font-size: .93rem; font-variant-numeric: tabular-nums; }
.seed-table th, .seed-table td { padding: 7px 8px; text-align: left; vertical-align: top; border-bottom: 1px solid var(--line); }
.seed-table th { border-bottom-color: var(--ink); }
.seed-table th:nth-child(-n+3) { white-space: nowrap; }
.seed-table td:last-child { overflow-wrap: anywhere; }
@media (max-width: 680px) {
  header { align-items: flex-start; padding-block: 15px 12px; }
  h1 { font-size: 1.5rem; }
  .toolbar { padding-block: 8px; gap: 6px; }
  .toolbar-actions { margin-left: 0; }
  .search { max-width: none; flex-basis: 100%; order: 2; }
  #csvMenu, #columnMenu { position: fixed; top: auto; left: var(--gutter); right: auto; margin-top: 6px; max-height: 55dvh; overflow: auto; }
  .topic-metrics { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .topic-dialog-header, #topicContent { padding: 12px; }
}
</style>
</head>
<body>
<header>
  <div><h1 id="pageTitle">リカーリングトピック集計</h1><p class="source-file">20260301_62_001_リカーリングトピック集計.csv</p></div>
  <button id="downloadDataset" hidden>集計CSVを保存</button>
</header>
<div id="tabs" class="tabs" role="tablist" aria-label="開いているCSV" hidden></div>
<div class="toolbar">
  <div id="viewSwitcher" role="group" aria-label="表示形式" hidden>
    <button id="summaryView" aria-pressed="true">トピック一覧</button>
    <button id="rawView" aria-pressed="false">全列の表</button>
  </div>
  <label class="search"><input id="search" type="search" placeholder="トピック名・語句を検索" aria-label="全列から検索" disabled></label>
  <div class="toolbar-actions">
    <button id="restoreDataset" hidden>集計CSVを表示</button>
    <button id="open">CSVを開く</button>
  <details id="csvOptions">
    <summary>読み込み設定</summary>
    <div id="csvMenu">
      <label>読み込む範囲<select id="readMode"><option value="all">全行</option><option value="limited">先頭のみ</option></select></label><div id="rowLimitLabel" hidden><input id="rowLimit" type="number" min="1" max="1000000" step="any" value="100" style="width:95px" aria-label="読み込むデータ行数"><span class="row-stepper"><button id="moreRows" aria-label="読み込む行数を100行増やす" title="100行増やす">▲</button><button id="fewerRows" aria-label="読み込む行数を100行減らす" title="100行減らす">▼</button></span>行</div>
<label>文字コード<select id="encoding"><option value="auto">自動判定</option><option value="utf-8">UTF-8</option><option value="shift_jis">Shift_JIS / CP932</option><option value="euc-jp">EUC-JP</option><option value="utf-16le">UTF-16 LE</option><option value="utf-16be">UTF-16 BE</option></select></label>
<label>区切り<select id="delimiter"><option value="auto">自動判定</option><option value=",">カンマ</option><option value="tab">タブ</option><option value=";">セミコロン</option></select></label>
<label><input id="header" type="checkbox" checked>先頭行を見出しにする</label>
      <button id="reload" disabled>再読み込み</button><input type="file" id="reloadFile" accept=".csv,.tsv,.txt,text/csv,text/tab-separated-values" hidden><input type="file" id="file" multiple accept=".csv,.tsv,.txt,text/csv,text/tab-separated-values" hidden>
    </div>
  </details>
  <details id="columnsPanel"><summary>列の設定</summary><div id="columnMenu"><div class="column-actions"><button id="showAll">すべて表示</button><button id="hideAll">すべて非表示</button><button id="resetWidths">幅をリセット</button></div><div class="column-help">見出しの右端で列幅を調整できます。ダブルクリックすると内容に合わせます。</div><div id="columnList">ファイルを開くと設定できます。</div></div></details>
    <button id="clearFilters" hidden>列フィルタを解除</button>
  </div>
</div>
<div id="message" role="status" aria-live="polite" hidden></div>
<div id="scopeBar" hidden><span id="scopeBadge"></span><span id="scopeNote"></span></div>
<div id="schemaNotice" hidden role="status"><span id="schemaNoticeText"></span><button id="dismissSchemaNotice">閉じる</button></div>
<div id="conditionsBar" aria-label="適用中の絞り込み条件" hidden></div>
<div id="datasetLine" hidden>
  <span id="datasetScope" role="status"></span>
  <span id="topicHint">トピック名を選ぶとシード別の結果が開きます。</span>
</div>
<main id="main" aria-busy="false">
  <div id="empty">
    <h2 id="emptyTitle">CSVを開く</h2>
    <p id="emptyNote">「CSVを開く」からファイルを選ぶか、ここにドロップしてください。</p>
    <button id="openDataset" class="primary" hidden>集計CSVを読み込む</button>
  </div>
<div id="tableWrap" hidden tabindex="0" role="region" aria-label="CSVの表"><table id="table" aria-label="CSVデータ"><colgroup id="colgroup"></colgroup><thead id="head"></thead><tbody id="body"></tbody></table></div><aside id="cellDetails" aria-labelledby="cellDetailsTitle" hidden><div id="cellDetailsHeader"><h2 id="cellDetailsTitle">セルの内容</h2><div><button id="copyCell">内容をコピー</button><button id="closeCell">閉じる</button></div></div><textarea id="cellText" readonly aria-label="セルの全文" spellcheck="false"></textarea><span id="cellCopyStatus" role="status"></span></aside></main>
<footer id="footer" hidden>
  <span id="info"></span>
  <div class="page-status">
    <span id="count"></span>
    <span>150行 / ページ</span>
    <div class="pages" id="pagination" hidden>
      <button id="prev" disabled>前へ</button>
      <span id="page"></span>
      <button id="next" disabled>次へ</button>
    </div>
  </div>
</footer>
<section id="filterPopup" role="dialog" aria-labelledby="filterTitle" hidden><h2 id="filterTitle">列フィルタ</h2><input id="filterSearch" type="search" placeholder="候補を検索…" aria-label="フィルタ候補を検索"><div class="filter-actions"><button id="filterSelectAll">すべて選択</button><button id="filterSelectNone">すべて解除</button></div><div id="filterValues"></div><div class="filter-pages"><button id="filterPrev" aria-label="前の候補">←</button><span id="filterCount" role="status"></span><button id="filterNext" aria-label="次の候補">→</button></div><div id="filterNote">候補は読み込み範囲内で、全体検索と他列の条件を反映します。<br>同じ列は「いずれか」、別の列は「両方」です。<br>すべて選択／解除は検索中も候補全体が対象です。</div><div class="filter-actions"><button id="filterApply" class="primary">適用</button><button id="filterClear">この列を解除</button><button id="filterCancel">キャンセル</button></div></section>
<div id="dropOverlay">ここにドロップして開く</div>
<dialog id="topicDialog" aria-labelledby="topicTitle">
  <div class="topic-dialog-header">
    <div><h2 id="topicTitle"></h2><p id="topicSubtitle"></p></div>
    <button id="closeTopic" autofocus>閉じる</button>
  </div>
  <div id="topicContent"></div>
</dialog>
<noscript>CSVを表示するにはJavaScriptを有効にしてください。</noscript>
<script>
'use strict';
// Parser and worker share no libraries; this file works directly via file://.
function parseCSV(text, delimiter, limit = Infinity, partial = false) {
  const rows = []; let row = [], cell = '', quoted = false, afterQuote = false;
  function endCell() { row.push(cell); cell = ''; afterQuote = false; }
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (quoted) {
      if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else { quoted = false; afterQuote = true; } }
      else cell += c;
    } else if (c === delimiter) endCell();
    else if (c === '\n' || c === '\r') {
      endCell(); rows.push(row); row = [];
      if (c === '\r' && text[i + 1] === '\n') i++;
      if (rows.length >= limit) return rows;
    } else if (c === '"' && cell === '' && !afterQuote) quoted = true;
    else {
      if (afterQuote) { if (c === ' ' || c === '\t') continue; throw Error('閉じ引用符の後に不正な文字があります。区切り文字を確認してください。'); }
      cell += c;
    }
  }
  if (partial) return rows;
  if (quoted) throw Error('引用符が閉じていません。CSVの内容または区切り文字を確認してください。');
  if (cell !== '' || row.length || afterQuote) { endCell(); rows.push(row); }
  return rows;
}
function detectDelimiter(text, partial = false) {
  let best = ',', score = -1;
  for (const d of [',', '\t', ';']) {
    try {
      const rows = parseCSV(text, d, 20, partial).filter(r => r.some(c => c !== ''));
      const widths = new Map(); rows.forEach(r => widths.set(r.length, (widths.get(r.length) || 0) + 1));
      for (const [width, count] of widths) {
        const s = width > 1 ? count / rows.length * 100 + Math.min(width, 100) / 100 : 0;
        if (s > score) { score = s; best = d; }
      }
    } catch (_) { /* A candidate delimiter can make valid quoted CSV look invalid. */ }
  }
  return best;
}
function decodeBytes(bytes, requested, partial = false) {
  let encoding = requested;
  if (encoding === 'auto') {
    if (bytes[0] === 255 && bytes[1] === 254) encoding = 'utf-16le';
    else if (bytes[0] === 254 && bytes[1] === 255) encoding = 'utf-16be';
    else {
      // ponytail: BOM-less legacy encodings are heuristic; expose manual override for ambiguous bytes.
      encoding = ['utf-8', 'shift_jis', 'euc-jp'].find(e => {
        try { new TextDecoder(e, {fatal:true}).decode(bytes, {stream:partial}); return true; } catch (_) { return false; }
      }) || 'utf-8';
    }
  }
  let text, warning = '';
  try { text = new TextDecoder(encoding, {fatal:true}).decode(bytes, {stream:partial}); }
  catch (_) { text = new TextDecoder(encoding).decode(bytes, {stream:partial}); warning = '変換できない文字があります。文字コードを切り替えてください。'; }
  return {text: text.replace(/^\uFEFF/, ''), encoding, warning};
}
async function readCSVFile(m, isCurrent) {
  const maximum = 50 * 1024 * 1024;
  if (m.limit && (!Number.isInteger(m.limit) || m.limit < 1 || m.limit > 1000000)) throw Error('読み込む行数は1〜1,000,000で指定してください。');
  const limit = m.limit > 0 ? m.limit + (m.header ? 1 : 0) : Infinity;
  if (!m.limit && m.file.size > maximum) throw Error('全行読み込みは50 MBまでです。「先頭のみ」を選んでください。');
  let end = m.limit ? Math.min(m.file.size, 65536) : m.file.size;
  while (true) {
    const buffer = await (m.limit ? m.file.slice(0, end) : m.file).arrayBuffer();

  if (active && active.limit !== defaultLimit) { active.limit = defaultLimit; load(); }
}
$('readMode').onchange = $('rowLimit').onchange = changeReadLimit;
function stepReadLimit(direction) {
  const current = Number($('rowLimit').value);
  $('rowLimit').value = Math.max(1, Math.min(1000000, (Number.isFinite(current) ? Math.round(current) : 100) + direction * 100));
  changeReadLimit();
}
$('moreRows').onclick = () => stepReadLimit(1);
$('fewerRows').onclick = () => stepReadLimit(-1);
$('rowLimit').onkeydown = e => {
  if (e.key === 'ArrowUp' || e.key === 'ArrowDown') { e.preventDefault(); stepReadLimit(e.key === 'ArrowUp' ? 1 : -1); }
};
let reloadTarget = null;
const pickerOptions = {multiple:true, types:[{description:'CSV / TSV', accept:{'text/csv':['.csv','.tsv','.txt']}}]};
async function pickFiles() {
  if (!window.showOpenFilePicker) { $('file').click(); return; }
  try {
    const handles = await window.showOpenFilePicker(pickerOptions);
    const files = await Promise.all(handles.map(handle => handle.getFile()));
    openFiles(files, handles);
  } catch (error) {
    if (error.name !== 'AbortError') { message('ファイル選択を利用できません。通常の選択画面から開いてください。', true); $('file').click(); }
  }
}
function replaceTabFile(tab, file) {
  if (!tabs.includes(tab) || !file) return;
  if (!tab.limit && file.size > 50 * 1024 * 1024) { message('全行読み込みは50 MBまでです。「先頭のみ」を選んでください。', true); return; }
  if (tab === active) { tab.scrollTop = $('tableWrap').scrollTop; tab.scrollLeft = $('tableWrap').scrollLeft; }
  tab.file = file; renderTabs(); load(tab, true);
}
function reselectFile(tab) {
  reloadTarget = tab; $('reloadFile').value = '';
  message(`「${tab.file.name}」を選び直して再読み込みしてください。`); $('reloadFile').click();
}
async function reloadFile() {
  const tab = active; if (!tab || tab.pending || tab.reloading) return;
  if (!tab.hosted && !tab.handle) { reselectFile(tab); return; }
  tab.reloadError = '';
  tab.reloading = true; updateStatus();
  try {
    const file = tab.hosted ? await fetchDataset() : await tab.handle.getFile();
    if (tab.hosted && !tab.limit && file.size > 50 * 1024 * 1024) {
      throw new Error('全行読み込みは50 MBまでです');
    }
    replaceTabFile(tab, file);
  } catch (error) {
    if (tabs.includes(tab)) {
      if (tab.hosted) tab.reloadError = `集計CSVを再読み込みできませんでした（${error.message}）。`;
      else { tab.handle = null; reselectFile(tab); }
    }
  }
  finally { tab.reloading = false; if (tab === active) updateStatus(); }
}
$('open').onclick = pickFiles;
$('csvOptions').ontoggle = () => { if ($('csvOptions').open) $('columnsPanel').open = false; };
$('reload').onclick = reloadFile;
$('file').onchange = e => { openFiles(e.target.files); e.target.value = ''; };
$('reloadFile').onchange = e => {
  const tab = reloadTarget, file = e.target.files[0]; reloadTarget = null; e.target.value = '';
  if (!tab || !tabs.includes(tab) || !file) return;
  if (file.name !== tab.file.name) { message(`再読み込みする「${tab.file.name}」を選んでください。`, true); return; }
  replaceTabFile(tab, file);
};
document.addEventListener('pointerdown', e => {
  if (filterDialog && !$('filterPopup').contains(e.target) && e.target !== filterDialog.tab.filterButtons[filterDialog.column]) closeFilter(false);
  if ($('columnsPanel').open && !$('columnsPanel').contains(e.target)) $('columnsPanel').open = false;
  if ($('csvOptions').open && !$('csvOptions').contains(e.target)) $('csvOptions').open = false;
});
document.addEventListener('keydown', e => {
  if ($('topicDialog').open) return;
  if (e.key === 'Escape' && $('csvOptions').open) {
    $('csvOptions').open = false;
    $('csvOptions').querySelector('summary').focus();
    return;
  }
  if (e.key === 'Escape' && filterDialog) { closeFilter(); return; }
  if (e.key === 'Escape' && !$('cellDetails').hidden && !$('columnsPanel').open) { closeCellDetails(); return; }
  if (e.key === 'Escape' && $('columnsPanel').open) { $('columnsPanel').open = false; $('columnsPanel').querySelector('summary').focus(); }
});
$('encoding').onchange = () => { if (active) { active.encoding = $('encoding').value; load(); } };
$('delimiter').onchange = () => { if (active) { active.filters = {}; active.delimiter = $('delimiter').value; load(); } };
$('header').onchange = () => { if (active) { closeFilter(false); active.filters = {}; active.header = $('header').checked; if (active.limit) { load(); return; } active.generation++; active.fits = {}; active.autoFit = true; active.sort = -1; query(active, true); } };
$('search').oninput = () => {
  const tab = active; if (!tab || !tab.ready) return;
  tab.search = $('search').value; clearTimeout(tab.timer); tab.request++; tab.pending = true; updateStatus(); tab.timer = setTimeout(() => query(tab, true), 180);
};
$('prev').onclick = () => { if (active && !active.pending && active.page > 0) { active.page--; active.scrollTop = 0; query(); } };
$('next').onclick = () => { if (active && !active.pending && active.result && active.page < active.result.pages - 1) { active.page++; active.scrollTop = 0; query(); } };
$('showAll').onclick = () => { if (active) { active.hidden.clear(); renderTable(); renderColumnSettings(); updateStatus(); } };
$('hideAll').onclick = () => { if (active && active.result) { active.hidden = new Set(active.result.headers.map((_,i) => i)); renderTable(); renderColumnSettings(); updateStatus(); } };
$('resetWidths').onclick = () => { if (active && active.result) requestFit(active, active.result.headers.map((_,i) => i)); };
$('tableWrap').onscroll = () => { if (active) { active.scrollTop = $('tableWrap').scrollTop; active.scrollLeft = $('tableWrap').scrollLeft; } };
window.addEventListener('beforeunload', () => { tabs.forEach(t => t.worker.terminate()); URL.revokeObjectURL(workerURL); });
let dragDepth = 0;
document.addEventListener('dragenter', e => { if (Array.from(e.dataTransfer.types).includes('Files')) { e.preventDefault(); dragDepth++; document.body.classList.add('dragging'); } });
document.addEventListener('dragover', e => { e.preventDefault(); });
document.addEventListener('dragleave', () => { if (--dragDepth <= 0) { dragDepth = 0; document.body.classList.remove('dragging'); } });
document.addEventListener('drop', e => { e.preventDefault(); dragDepth = 0; document.body.classList.remove('dragging'); openFiles(e.dataTransfer.files); });
document.addEventListener('keydown', e => { if ((e.ctrlKey || e.metaKey) && e.key === 'o') { e.preventDefault(); pickFiles(); } });
renderActive();
if (datasetURL) openDataset(false);
</script>
</body>
</html>
